# SDD project configuration — web-global-3d
schema: spec-driven

context: |
  Project: web-global-3d (single Vite + React + TypeScript app, route-split public / + lazy /admin)
  Planned stack: Vite + React + TypeScript + Supabase (PostgreSQL), mobile-first web UI
  Deliverables: (1) internal workshop management app for a 3D printing business,
  (2) public catalog web with WhatsApp checkout
  Architecture: feature-area layout under src/ with @/ alias; Supabase RLS is the security boundary
  Testing: vitest (jsdom) + tsc --noEmit + ESLint (flat) + Prettier
  Style: 4-color palette as CSS custom properties; mobile-first; clean UI (no nested boxes)

strict_tdd: false
# Re-evaluated 2026-08-19 after project-foundation landed a test runner (vitest).
# Decision: keep standard mode — test-first remains optional per change, not a
# hard gate. strict_tdd MAY be flipped to true on a future change if the team
# opts into RED-GREEN-REFACTOR; unit + smoke tests now exist as the baseline.

testing:
  detected: 2026-08-19
  runner: vitest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage: false
  quality:
    linter: eslint
    type_checker: tsc
    formatter: prettier
  note: >
    Tooling landed with project-foundation: vitest (jsdom), tsc --noEmit,
    ESLint (flat config), Prettier. Unit tests (env validation) and an opt-in
    connectivity smoke test (skipIf when env is absent) are present. E2E remains
    out of scope until a business slice exists.

rules:
  proposal:
    - Include rollback plan for risky changes
    - State which deliverable (workshop app, public catalog, or shared) the change affects
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Record Supabase schema/RLS decisions explicitly
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
