<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Global3D · Impresión 3D en Corrientes</title>
    <meta
      name="description"
      content="Vasos, trofeos, figuras, llaveros y regalos impresos en 3D en Corrientes. Personalizados con tu nombre, tu club o tu logo. Retiro en Junín 862."
    />
    <meta name="theme-color" content="#1d1d1b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Global3D · Impresión 3D en Corrientes" />
    <meta
      property="og:description"
      content="Vasos, trofeos, figuras y regalos impresos en 3D. Personalizados con tu nombre, tu club o tu logo."
    />
    <meta property="og:locale" content="es_AR" />
    <!-- Las fichas de producto tienen su propia vista previa (api/tienda-og.ts) -->
    <meta
      property="og:image"
      content="https://global3d-corrientes.vercel.app/tienda/familias/premiaciones-2.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1b'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%23f37021'%3E3D%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee
      try {
        var t = localStorage.getItem('g3d.tienda.theme')
        if (t === 'dark' || t === 'light')
          document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
